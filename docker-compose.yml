services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pdfmd-backend
    ports:
      - "8000:8000"
    environment:
      OCR_BACKEND: ${OCR_BACKEND:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      MLX_URL: ${MLX_URL:-http://localhost:8080}
      AUTO_PULL_MODEL: "true"
      UPLOAD_DIR: /app/uploads
      RESULT_DIR: /app/results
    volumes:
      - uploads:/app/uploads
      - results:/app/results
      - data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
        required: false

  frontend:
    build:
      context: ./frontend
    container_name: pdfmd-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  # Optional: Ollama service (only started with --profile ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: pdfmd-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama-data:
  uploads:
  results:
  data:
